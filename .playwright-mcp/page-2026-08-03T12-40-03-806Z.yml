                  - generic [ref=f59e163]: "Re: Offer latter -Ai Intern Stateai"
                  - generic [ref=f59e164]: "Dear Sir, I hope you are doing well. I am writing to inform you of an unexpected change in my situation. Yesterday afternoon, I received an offer for a temporary job here in my country. I accepted it because of my current financial situation. I urgently need a stable source of income, and given my circumstances, I felt I had no choice but to accept the opportunity. I want to emphasize that I remain genuinely interested in this internship and do not want to lose the opportunity to learn and contribute to the team. I am truly grateful that you gave me the chance to join State AI, and I sincerely appreciate your trust and support. Unfortunately, I have realized that I will no longer be able to fulfill the sales responsibilities as expected due to my new work schedule. However, I would like to ask whether it might be possible to continue the internship with an adjusted schedule. I am available to work in the evenings after my regular working hours, and I am fully committed to making the most of the internship if this arrangement is feasible for the team. I completely understand if such a schedule is not possible, and I will fully respect whatever decision you believe is best. I sincerely apologize for any inconvenience this unexpected situation may cause. Thank you once again for the opportunity and for your understanding. Regardless of the outcome, I am truly grateful for your support and for allowing me to be part of the team. Best regards, Zaratiana Fify NELY On Mon, Jul 13, 2026, 9:26 AM Zaratiana Fify NELY <nelyblue20@gmail.com> wrote: > Hi Sir, > > I hope you're doing well. > > I have a couple of questions about the internship. > > As mentioned in the offer letter, during the first month we'll be learning > core AI concepts such as LLMs, AI agents, automation, prompt engineering, > and Retrieval-Augmented Generation (RAG). > > Could you give me an idea of what I should aim to master within each of > these topics? A brief breakdown of the key concepts to focus on would > really help me study more effectively alongside your lectures. > > I also wanted to ask about project management. Will we be using tools like > Trello or Jira, or will everything be managed through the ticketing system? > > Thanks in advance! I'm looking forward to getting started. > > Best regards, > > Zaratiana Fify NELY > > > On Tue, 7 Jul 2026 at 10:07, Zaratiana Fify NELY <nelyblue20@gmail.com> > wrote: > >> Dear Sartaj Ahmed, >> >> Thank you for the clarification. I appreciate your detailed explanation >> and look forward to joining the team. >> >> Best regards, >> Zaratiana Fify NELY >> >> >> On Mon, 6 Jul 2026 at 18:25, State AI <contact@stateai.in> wrote: >> >>> >>> >>> >>> Dear Zaratiana, >>> >>> Thank you for sending the signed offer letter. We're excited to have you >>> join the team. >>> >>> Regarding your questions, we offer a flexible work environment. Our >>> focus is on completing assigned tasks and delivering quality work on time >>> rather than tracking fixed 8- or 9-hour workdays. >>> >>> As a general guideline, our working window will be 10:00 AM to 4:00 PM >>> (IST), but there is flexibility within that timeframe as long as you're >>> available for meetings, lectures, and project discussions when required. >>> **Sundays will be off.** >>> >>> During the first two months, your internship will primarily focus on >>> learning and research. You can expect: >>> >>> * Three theory lectures per week covering AI concepts, tools, and >>> research methodologies. >>> * Small research projects and practical assignments to help you apply >>> what you learn. >>> * Regular guidance and feedback from the team throughout the internship. >>> >>> We completely understand your availability, and it's perfectly fine that >>> you'll be able to work full-time from September onward. We'll ensure the >>> schedule remains manageable until then. >>> >>> We're looking forward to working with you and are excited to see your >>> growth during the internship. If you have any other questions, feel free to >>> reach out anytime. >>> >>> Best regards, >>> >>> Sartaj Ahmed >>> Founder >>> State AI >>> >>"
