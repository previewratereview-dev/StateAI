lient relationships, building a predictable > sales pipeline, and creating long-term growth. > * Our current project values typically range between USD 3,000–15,000+ > depending on the scope and complexity. > * Sales cycles generally range from 2–8 weeks, depending on the client and > engagement. > * During the evaluation period, our focus is on creating quality > opportunities and closing business rather than rigid revenue targets. > > **2. Lead Generation & Market Coverage** > > * Initially, the role will involve a combination of self-generated > outreach and opportunities generated through the founders' network and our > ongoing marketing initiatives. > * We are currently focused on AI Automation, AI Voice Agents, Custom AI > Solutions, SaaS Development, and Digital Transformation for Healthcare, > Real Estate, Professional Services, Education, and SMBs. > > 3. Evaluation Period > During the 60-day evaluation period, we will assess: > > * Quality and consistency of outreach > * Qualified meetings booked > * Pipeline value created > * Proposals submitted > * Revenue generated > * Strategic thinking, communication, and collaboration > > The objective is to evaluate your overall contribution to the company's > growth rather than fixed KPIs. > > 4. Full-Time Conversion > Upon successful completion of the evaluation period, we intend to offer a > full-time role with a competitive fixed salary, performance incentives, and > expanded leadership responsibilities. The exact structure will depend on > performance and business growth. > > 5. Joining & Onboarding > We would like you to join as soon as mutually convenient. > > Your onboarding will include: > > * Product and service training > * Sales collateral and positioning > * Target market overview > * Founder strategy sessions > * CRM and sales process alignment > > I also want to share something about our long-term vision. > > State AI is more than a services company for us. We are currently building > a flagship AI product that will operate under the State AI brand and serve > as our primary focus for future growth and fundraising. Our vision is to > build a scalable AI company, and we see significant opportunities ahead as > we execute this roadmap. > > If you join us at this stage, you'll have the opportunity to grow > alongside the company. We're looking for someone who doesn't see this as > just another sales role, but who approaches it with an ownership > mindset—someone who is willing to help build the business, contribute > ideas, and take responsibility for driving growth as if it were their own > company. > > We value dedication, initiative, and long-term commitment, and we believe > that people who help build State AI from its early stages will naturally > have the opportunity to take on larger responsibilities as we grow. > > We hope this provides the clarity you were looking for. Please let me know > if you have any additional questions. We would be delighted to have you > join us on this journey. > > Warm regards, > > Sartaj Ahmed > Founder & CEO, State AI > > > -- *Thanks & Regards,* *SALEESH SAMUEL* *Mob: +91-9900531253*"
