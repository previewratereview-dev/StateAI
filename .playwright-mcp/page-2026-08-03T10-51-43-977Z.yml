        - generic [ref=f6e56]:
          - heading "5. Managing or Disabling Cookies" [level=2] [ref=f6e57]
          - paragraph [ref=f6e58]: Most browsers allow you to control cookies through their settings, including the ability to view, block, or delete cookies. The exact steps vary by browser — refer to your browser's help section for guidance.
          - list [ref=f6e59]:
            - listitem [ref=f6e60]: Use your browser settings to block or delete cookies
            - listitem [ref=f6e62]: Choose "Do Not Track" or similar privacy settings if you prefer
            - listitem [ref=f6e64]: Note that disabling essential cookies may affect website functionality
          - paragraph [ref=f6e66]: Because our approach to cookies may change as we improve this website, we encourage you to review this Cookie Policy periodically.
