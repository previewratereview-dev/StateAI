          - paragraph [ref=f6e41]:
            - text: This website is hosted on Vercel and uses
            - strong [ref=f6e42]: Vercel Web Analytics
            - text: to collect anonymized, aggregated information about site usage — such as the pages you visit and your approximate location at the country or region level. This data helps us understand what content is useful and improve the site.
          - paragraph [ref=f6e43]: Vercel Web Analytics does not use persistent cookies and does not collect personal data such as your name, email, or IP address as personal data. You can learn more in Vercel's own documentation and privacy policy.
        - generic [ref=f6e44]:
