          - heading "1. What Are Cookies" [level=2] [ref=f6e14]
          - paragraph [ref=f6e15]: Cookies are small text files stored on your device (browser or similar) when you visit a website. They allow the website to recognize your device, remember your preferences, and understand how the site is used. Cookies set by the website owner are called "first-party cookies," while cookies set by other parties are called "third-party cookies."
